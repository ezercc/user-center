{{ partial "header.html" . }}

{{ partial "sidebar.html" . }}

<main class="main-content">
    <div class="container">
        <h1 class="page-title">{{ T "invite_friends" }}</h1>

        <div class="settings-grid">
            <!-- 左侧卡片：专属邀请码与链接复制 -->
            <div class="card invite-code-card">
                <div class="card-header">
                    <h3><span class="material-icons-round">card_giftcard</span> {{ T "your_invite_code" }}</h3>
                </div>
                <div class="card-body">
                    <div class="code-box-wrapper">
                        <div class="invite-code-display" id="invite-code-display">--------</div>
                        <div class="pulse-ring"></div>
                    </div>
                    <p class="text-secondary hint-text">{{ T "invite_friends_hint" | default "分享您的邀请码或专属链接，邀请新朋友注册加入 Ezer" }}</p>
                    
                    <div class="link-copy-container">
                        <input type="text" id="invite-link-input" readonly value="Loading invite link...">
                        <button class="btn-primary" id="btn-copy-link">
                            <span class="material-icons-round btn-icon">content_copy</span>
                            <span class="btn-text">{{ T "copy_invite_link" }}</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧卡片：已成功邀请的好友列表 -->
            <div class="card referred-list-card">
                <div class="card-header">
                    <h3><span class="material-icons-round">people</span> {{ T "invited_users_list" }}</h3>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div id="referred-users-container" class="table-responsive">
                        <div style="padding: 40px; text-align: center; color: var(--text-secondary);" id="referred-users-loading">
                            <div class="spinner" style="margin: 0 auto 12px auto;"></div>
                            <p>{{ T "loading" }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    /* 邀请码专属高级视觉设计 */
    .invite-code-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .code-box-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(26, 115, 232, 0.04);
        border-radius: 12px;
        border: 1px dashed rgba(26, 115, 232, 0.3);
        margin-bottom: 16px;
        overflow: hidden;
    }

    [data-theme="dark"] .code-box-wrapper {
        background: rgba(26, 115, 232, 0.08);
        border-color: rgba(26, 115, 232, 0.5);
    }

    .invite-code-display {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--primary-color);
        font-family: 'Outfit', 'Inter', monospace;
        z-index: 2;
        text-shadow: 0 0 20px rgba(26, 115, 232, 0.2);
    }

    .pulse-ring {
        position: absolute;
        width: 100px;
        height: 100px;
        border: 2px solid var(--primary-color);
        border-radius: 50%;
        opacity: 0;
        animation: pulse-ring-animation 3s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;
        pointer-events: none;
    }

    @keyframes pulse-ring-animation {
        0% { transform: scale(0.3); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: scale(2.2); opacity: 0; }
    }

    .hint-text {
        text-align: center;
        margin-bottom: 24px;
        font-size: 14px;
        line-height: 1.5;
    }

    /* 链接与复制栏设计 */
    .link-copy-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    #invite-link-input {
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text-secondary);
        font-size: 13px;
        outline: none;
        text-align: center;
        transition: border-color 0.2s;
    }

    #invite-link-input:focus {
        border-color: var(--primary-color);
    }

    #btn-copy-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 46px;
        border-radius: 23px;
        font-weight: 500;
        font-size: 14px;
        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
        transition: all 0.2s ease;
    }

    #btn-copy-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(26, 115, 232, 0.3);
    }

    /* 表格与列表高级样式 */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
    }

    .invite-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    .invite-table th {
        padding: 14px 20px;
        font-weight: 500;
        font-size: 13px;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-color);
        background: rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] .invite-table th {
        background: rgba(255, 255, 255, 0.02);
    }

    .invite-table td {
        padding: 14px 20px;
        font-size: 14px;
        color: var(--text-color);
        border-bottom: 1px solid var(--border-color);
    }

    .invite-table tbody tr {
        transition: background-color 0.15s ease;
    }

    .invite-table tbody tr:hover {
        background-color: rgba(26, 115, 232, 0.03);
    }

    .invite-table tbody tr:last-child td {
        border-bottom: none;
    }

    .empty-state {
        padding: 48px 24px;
        text-align: center;
        color: var(--text-secondary);
    }

    .empty-state span {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.3;
    }

    .btn-icon {
        font-size: 18px;
    }

    @media (max-width: 768px) {
        .settings-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<script src="{{ absURL "js/common.js"}}"></script>
<script type="text/javascript">
    window.inviteI18n = {
        copied: '{{ T "copied" | default "已复制" }}',
        invite_link_copied: '{{ T "invite_link_copied" | default "邀请链接已复制！" }}',
        no_invited_users: '{{ T "no_invited_users" | default "你还没有邀请过任何好友，快去分享链接吧！" }}',
        invite_code_not_found: '{{ T "invite_code_not_found" | default "未获取到邀请码，请稍后再试" }}',
        reg_email: '{{ T "reg_email" | default "注册邮箱" }}',
        reg_date: '{{ T "reg_date" | default "注册日期" }}'
    };
</script>
<script src="{{ absURL "js/invite.js"}}"></script>
</body>
</html>
