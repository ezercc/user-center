<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>样式交互 Mock 预览 | Ezer账号</title>
    <link href="https://fonts.cat.net/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.cat.net/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./themes/usercenter/static/css/common.css">
    <link rel="stylesheet" href="./themes/usercenter/static/css/login.css">
    <style>
        /* 顶部 Mock 控制栏 (带父级约束，与业务样式隔离) */
        .mock-toolbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px var(--shadow-color);
            max-width: 90vw;
            flex-wrap: wrap;
            justify-content: center;
        }
        .mock-toolbar span.mock-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mock-toolbar button {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--text-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .mock-toolbar button:hover {
            background: rgba(26, 115, 232, 0.08);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>

    <!-- 顶部调试快捷控制面板 -->
    <div class="mock-toolbar">
        <span class="mock-title">
            <span class="material-icons-round" style="font-size:16px;">tune</span>
            Mock 面板
        </span>
        <button id="mock-btn-toggle-theme">
            <span class="material-icons-round" style="font-size:14px;">dark_mode</span>
            切换深色模式
        </button>
        <button id="mock-btn-trigger-login-loading">
            <span class="material-icons-round" style="font-size:14px;">sync</span>
            测试登录按钮转圈(2s)
        </button>
        <button id="mock-btn-trigger-google">
            <i class="fa-brands fa-google" style="color:#DB4437; font-size:12px;"></i>
            测试 Google 授权提示
        </button>
        <button id="mock-btn-trigger-github">
            <i class="fa-brands fa-github" style="font-size:12px;"></i>
            测试 GitHub 授权提示
        </button>
    </div>

    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-left">
            <p class="brand-logo">Ezer账号</p>
        </div>
        <div class="nav-right">
            <button id="theme-toggle" class="icon-btn nav-icon-btn">
                <span class="material-icons-round">dark_mode</span>
            </button>
        </div>
    </nav>

    <!-- 主登录卡片 -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 id="auth-title">欢迎回来</h2>
                <p id="auth-subtitle">请输入密码以继续</p>
            </div>

            <!-- 登录第二步：输入密码 -->
            <div id="step-password" class="auth-step active">
                <div class="user-chip" id="user-chip">
                    <span class="material-icons-round">account_circle</span>
                    <span id="display-email">demo-user@ezer.cc</span>
                </div>
                <div class="input-group">
                    <input type="password" id="input-password" required placeholder=" " value="MySecretPassword123">
                    <label for="input-password">输入密码</label>
                </div>
                <div class="actions-left-right">
                    <button class="btn-text" id="btn-forgot-pwd">忘记密码？</button>
                </div>
                <div class="actions-right mt-4">
                    <button class="btn-text" id="btn-back-email">返回</button>
                    <button class="btn-primary" id="btn-login">登录</button>
                </div>

                <div class="divider"><span>或通过第三方登录</span></div>

                <div class="social-login">
                    <button class="social-btn" data-provider="google" title="Google 登录">
                        <i class="fa-brands fa-google"></i>
                    </button>
                    <button class="social-btn" data-provider="github" title="GitHub 登录">
                        <i class="fa-brands fa-github"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 自包含纯净 Notifications 实现 (零外部依赖，绝不崩溃)
        // ==========================================
        const MockNotifications = {
            list: new Set(),
            show(message, type = 'info') {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;

                const icon = type === 'success' ? 'check_circle' :
                    type === 'error' ? 'error' :
                    type === 'info' ? 'info' : 'warning';

                notification.innerHTML = `
                    <div class="notification-wrapper">
                        <div class="notification-icon">
                            <span class="material-icons-round">${icon}</span>
                        </div>
                        <div class="notification-content"><p>${message}</p></div>
                    </div>
                `;

                document.body.appendChild(notification);
                this.list.add(notification);
                this.updatePosition();

                // 强制同步回流，立即展开，零等待
                void notification.offsetWidth;
                notification.classList.add('show');

                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        this.list.delete(notification);
                        notification.remove();
                        this.updatePosition();
                    }, 300);
                }, 3000);
            },

            updatePosition() {
                const arr = Array.from(this.list);
                let offset = 16;
                for (let i = arr.length - 1; i >= 0; i--) {
                    const item = arr[i];
                    item.style.bottom = `${offset}px`;
                    offset += item.offsetHeight + 12;
                }
            }
        };

        window.Notifications = MockNotifications;

        // 挂载 i18n
        window.i18n = {
            redirecting_to_provider: '正在前往 %s 授权...',
            login_success: '登录成功'
        };

        const btnLogin = document.getElementById('btn-login');

        // 模拟登录点击 (转圈 2 秒后复原)
        function triggerLoginLoading() {
            if (btnLogin.classList.contains('btn-loading')) return;
            btnLogin.disabled = true;
            btnLogin.classList.add('btn-loading');

            setTimeout(() => {
                btnLogin.disabled = false;
                btnLogin.classList.remove('btn-loading');
                MockNotifications.show('登录成功', 'success');
            }, 2000);
        }

        btnLogin.addEventListener('click', triggerLoginLoading);
        document.getElementById('mock-btn-trigger-login-loading').addEventListener('click', triggerLoginLoading);

        // 模拟第三方社交登录点击
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetBtn = e.currentTarget;
                if (targetBtn.getAttribute('aria-disabled') === 'true' || targetBtn.disabled) return;
                targetBtn.setAttribute('aria-disabled', 'true');
                targetBtn.disabled = true;

                const provider = targetBtn.getAttribute('data-provider');
                const providerNames = { google: 'Google', github: 'GitHub' };
                const pName = providerNames[provider] || (provider ? provider.charAt(0).toUpperCase() + provider.slice(1) : '');
                const template = window.i18n.redirecting_to_provider;

                // 立即同步弹出提示，绝不等待
                MockNotifications.show(template.replace('%s', pName), 'info');

                setTimeout(() => {
                    targetBtn.removeAttribute('aria-disabled');
                    targetBtn.disabled = false;
                }, 1500);
            });
        });

        document.getElementById('mock-btn-trigger-google').addEventListener('click', () => {
            const btn = document.querySelector('.social-btn[data-provider="google"]');
            if (btn) btn.click();
        });

        document.getElementById('mock-btn-trigger-github').addEventListener('click', () => {
            const btn = document.querySelector('.social-btn[data-provider="github"]');
            if (btn) btn.click();
        });

        // 深浅模式切换
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        document.getElementById('mock-btn-toggle-theme').addEventListener('click', toggleTheme);
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    </script>
</body>
</html>
